[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Blazorde/msi-center-linux"
authors = ["Blazorde"]
publish = false

[workspace.dependencies]
msi-core = { path = "crates/msi-core" }
clip-core = { path = "crates/clip-core" }
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false }
nvml-wrapper = "0.13.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.0", default-features = false, features = ["cache"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "service"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# msi-center-linux fork of msi-ec (see PATCHES.md). Package name differs from upstream ("msi-ec") so both are
# never mistaken for each other; the built module keeps upstream's name (msi-ec.ko / msi_ec) so the sysfs path
# /sys/devices/platform/msi-ec is unchanged. Remove any upstream msi-ec DKMS package before installing this one.
PACKAGE_NAME="msi-ec-blazorde"
PACKAGE_VERSION="0.13-blazorde.1"
BUILT_MODULE_NAME[0]="msi-ec"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# Plain Kbuild invocation (upstream's Makefile "modules" target builds for `uname -r`, not for the target kernel).
# dkms >= 3.0 appends LLVM=1 by itself when the target kernel was built with clang (CONFIG_CC_IS_CLANG=y), as on
# CachyOS.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="true"
AUTOINSTALL="yes"

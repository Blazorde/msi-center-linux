[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# The allow-list anticipates future dependencies; do not warn while some are unused.
unused-allowed-license = "allow"
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "GPL-3.0-or-later", "LGPL-2.1-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

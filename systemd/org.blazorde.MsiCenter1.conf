<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- System bus policy of msi-daemon. Installed to /usr/share/dbus-1/system.d/.
     Only root may own the name. Anyone may call: mutating methods are checked by polkit in the daemon. -->
<busconfig>
  <policy user="root">
    <allow own="org.blazorde.MsiCenter1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.blazorde.MsiCenter1" send_interface="org.blazorde.MsiCenter1"/>
    <allow send_destination="org.blazorde.MsiCenter1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.blazorde.MsiCenter1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.blazorde.MsiCenter1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
